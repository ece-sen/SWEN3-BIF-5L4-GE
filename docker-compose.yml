services:
  postgres:
    image: postgres:16
    container_name: paperless_postgres
    environment:
      POSTGRES_DB: dmsdb
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - paperless_network
    healthcheck:                                    
      test: ["CMD-SHELL", "pg_isready -U dms -d dmsdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  paperless.rest:
    image: ${DOCKER_REGISTRY-}paperlessrest
    build:
      context: .
      dockerfile: Paperless.REST/Dockerfile
    container_name: paperless_rest
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DMSDb=Host=postgres;Port=5432;Database=dmsdb;Username=dms;Password=dms123
    depends_on:                                     
      postgres:
        condition: service_healthy                  
    networks:
      - paperless_network
    restart: on-failure    
    
  paperless.frontend:
      image: ${DOCKER_REGISTRY-}paperlessfrontend
      build:
        context: ./frontend
        dockerfile: Dockerfile
      container_name: paperless_frontend
      ports:
        - "8080:80"
      environment:
        - REACT_APP_API_BASE_URL=http://paperless.rest:8080
      depends_on:
        - paperless.rest
      networks:
        - paperless_network
      restart: on-failure

volumes:
  postgres_data:

networks:
  paperless_network:
    driver: bridge